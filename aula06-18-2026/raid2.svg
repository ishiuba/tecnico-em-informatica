<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 1180" width="3200" height="1180"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Nunito; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="3200" height="1180" fill="#161718"></rect><g transform="translate(70 70) rotate(0 670 46.5127028532047)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">O RAID que implementamos é com uma controladora de software via firmware.</text><text x="0" y="82.01119767077044" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">As placa mãe também suportam a controladora externa com barramento PCIe.</text></g><g transform="translate(70 170) rotate(0 477.1250305175781 23.256351426602123)"><text x="0" y="35.4984948175658" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256373px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Como implementar RAID em um computador doméstico?</text></g><g transform="translate(90 790) rotate(0 158.1119588216136 30)"><text x="0" y="45.791999999999696" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="47.99999999999968px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Pré-requisitos:</text></g><g transform="translate(70 890) rotate(0 474.3342590332031 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Um computador com placa mãe que dá suporte a RAID</text></g><g transform="translate(70 950) rotate(0 465.999267578125 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- No mínimo 2 SSD ou HDD (preferencialmente iguais*)</text></g><g transform="translate(70 1010) rotate(0 620.2344970703125 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Drivers da controladora RAID (baixar no site do fabricante da placa mãe)</text></g><g transform="translate(70 1070) rotate(0 195.0919189453125 23.256351426602123)"><text x="0" y="35.4984948175658" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256373px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Pen Drive inicializável</text></g><g transform="translate(1810 50) rotate(0 184.1519165039051 30)"><text x="0" y="45.79199999999969" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="47.99999999999967px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Criação do RAID:</text></g><g transform="translate(1770 150) rotate(0 296.02533046375174 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">1) Entrar no firmware da placa mãe</text></g><g transform="translate(1770 210) rotate(0 502.66961669921875 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2) Alterar o funcionamento do barramento SATA para RAID.</text></g><g transform="translate(1810 270) rotate(0 653.94677734375 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Importante: Salvar as configurações, reiniciar e entrar no firmware novamente.</text></g><g transform="translate(1770 330) rotate(0 498.4277038574219 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3) Localizar e entrar no utilitário de gerenciamento do RAID</text></g><g transform="translate(1770 390) rotate(0 670 46.5127028532047)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">4) Neste caso, antes de tudo, remover o RAID pré-existente (verificar se já foi</text><text x="0" y="82.01119767077044" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">feito RAID anteriormente e removido)</text></g><g transform="translate(1770 490) rotate(0 364.529177148451 23.256351426602123)"><text x="0" y="35.4984948175658" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256373px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">5) Para criar o RAID (já dentro do utilitário):</text></g><g transform="translate(1790 550) rotate(0 119.79809425273811 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Create Array</text></g><g transform="translate(1790 610) rotate(0 282.81575565862477 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Escolher o tipo do RAID (0 ou 1)</text></g><g transform="translate(1790 670) rotate(0 181.80878578815464 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Selecionar os discos</text></g><g transform="translate(1790 730) rotate(0 313.0475769042969 23.256351426602123)"><text x="0" y="35.4984948175658" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256373px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Configurar cache de leitura e escrita</text></g><g transform="translate(1790 790) rotate(0 140.71016836044714 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Aplicar / Salvar</text></g><g transform="translate(1770 850) rotate(0 317.8304625977057 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">6) Inicializar a instalação do Windows</text></g><g transform="translate(1770 910) rotate(0 650 46.5127028532047)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">7) Durante o processo de particionamento do Windows, informar os drivers</text><text x="0" y="82.01119767077044" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">da controladora RAID.</text></g><g transform="translate(1770 1010) rotate(0 112.7467384077454 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">8) Particionar</text></g><g transform="translate(1770 1070) rotate(0 180.89713290084455 23.256351426602123)"><text x="0" y="35.49849481756579" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="37.21016228256372px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">9) Concluir instalação</text></g><g stroke-linecap="round" transform="translate(1710 10) rotate(0 740 580)"><path d="M0 0 C443.14 0, 886.28 0, 1480 0 M0 0 C440.82 0, 881.65 0, 1480 0 M1480 0 C1480 401.44, 1480 802.87, 1480 1160 M1480 0 C1480 367.21, 1480 734.42, 1480 1160 M1480 1160 C908.3 1160, 336.6 1160, 0 1160 M1480 1160 C996.34 1160, 512.68 1160, 0 1160 M0 1160 C0 880.49, 0 600.99, 0 0 M0 1160 C0 783.77, 0 407.55, 0 0" stroke="#d3d3d3" stroke-width="4" fill="none"></path></g><g stroke-linecap="round" transform="translate(30 750) rotate(0 720 210)"><path d="M0 0 C420.24 0, 840.48 0, 1440 0 M0 0 C396.42 0, 792.84 0, 1440 0 M1440 0 C1440 146.46, 1440 292.92, 1440 420 M1440 0 C1440 152.34, 1440 304.69, 1440 420 M1440 420 C1115.77 420, 791.53 420, 0 420 M1440 420 C1081.38 420, 722.76 420, 0 420 M0 420 C0 271.21, 0 122.42, 0 0 M0 420 C0 295.05, 0 170.1, 0 0" stroke="#d3d3d3" stroke-width="4" fill="none"></path></g><g stroke-linecap="round" transform="translate(10 10) rotate(0 730 140)"><path d="M0 0 C434.34 0, 868.68 0, 1460 0 M0 0 C324.88 0, 649.77 0, 1460 0 M1460 0 C1460 108.7, 1460 217.41, 1460 280 M1460 0 C1460 85.19, 1460 170.38, 1460 280 M1460 280 C1118.5 280, 777.01 280, 0 280 M1460 280 C1027.98 280, 595.96 280, 0 280 M0 280 C0 169.31, 0 58.62, 0 0 M0 280 C0 209.86, 0 139.72, 0 0" stroke="#d3d3d3" stroke-width="4" fill="none"></path></g></svg>