<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2340 1200" width="2340" height="1200"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Nunito; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="2340" height="1200" fill="#121212"></rect><g transform="translate(50 50) rotate(0 140.75997924804688 50)"><text x="0" y="76.32" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="80px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Revisão</text></g><g transform="translate(70 210) rotate(0 1010 45)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Arquitetura de computadores: método Von Neumann e Harvard. O que muda? Como o espaço da memória é usado. No Von</text><text x="0" y="79.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Neumann é compartilhado entre os aplicativos. No Harvard é exclusivo e separado.</text></g><g transform="translate(70 350) rotate(0 992.8076171875 22.5)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Atualmente, os computadores usam uma arquitetura híbrida. Em alguns locais usa-se Harvard e em outros, Von Neumann.</text></g><g transform="translate(70 450) rotate(0 482.41778564453125 22.5)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Hardware (peças) necessário para funcionar um dispositivo:</text></g><g transform="translate(50 570) rotate(0 813.1676025390625 22.5)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Placa mãe - faz com que todas os outros hardwares se comuniquem. É onde estão os barramentos.</text></g><g transform="translate(50 630) rotate(0 834.4796752929688 22.5)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Processador - realiza os cálculos e transformações de dados necessários para executar os programas.</text></g><g transform="translate(50 690) rotate(0 1020 45)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Memória RAM - é o espaço onde todos os Apps são executados. É volátil, só mantém os dados enquanto o dispositivo está</text><text x="0" y="79.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">ligado.</text></g><g transform="translate(50 810) rotate(0 1054.5655517578125 22.5)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- SSD/HD ou Armazenamento - onde os Apps são instalados. É não volátil, mantém os dados mesmo com o dispositivo desligado.</text></g><g transform="translate(50 870) rotate(0 1000 45)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Barramentos - fazem a interligação dos hardwares e permitem expansão ou add novas peças. Ex: PCI Express, SATA e</text><text x="0" y="79.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">USB.</text></g><g transform="translate(50 970) rotate(0 1070 45)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">No Windows, o Gerenciador de tarefas (CTRL + SHIFT + Esc) mostra o uso dos recursos (CPU, Memória RAM, Rede, SSD/HD e</text><text x="0" y="79.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">GPU) pelos aplicativos e sistema operacional.</text></g><g stroke-linecap="round" transform="translate(10 10) rotate(0 1160 590)"><path d="M0 0 C815.16 0, 1630.33 0, 2320 0 M0 0 C794.9 0, 1589.79 0, 2320 0 M2320 0 C2320 365.62, 2320 731.25, 2320 1180 M2320 0 C2320 431.82, 2320 863.64, 2320 1180 M2320 1180 C1642.48 1180, 964.96 1180, 0 1180 M2320 1180 C1848.46 1180, 1376.92 1180, 0 1180 M0 1180 C0 883.72, 0 587.44, 0 0 M0 1180 C0 840.08, 0 500.16, 0 0" stroke="#d3d3d3" stroke-width="4" fill="none"></path></g></svg>