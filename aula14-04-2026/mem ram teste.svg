      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1820" height="620" fill="#121212"></rect><g stroke-linecap="round" transform="translate(10 10) rotate(0 900 300)"><path d="M0 0 C373.55 0, 747.1 0, 1800 0 M0 0 C378.02 0, 756.04 0, 1800 0 M1800 0 C1800 173.03, 1800 346.05, 1800 600 M1800 0 C1800 171.47, 1800 342.94, 1800 600 M1800 600 C1384.41 600, 968.82 600, 0 600 M1800 600 C1148.17 600, 496.35 600, 0 600 M0 600 C0 432.88, 0 265.77, 0 0 M0 600 C0 447.71, 0 295.42, 0 0" stroke="#d3d3d3" stroke-width="4" fill="none"></path></g><g transform="translate(130 110) rotate(0 776.5530090332031 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Existem programas para testar a memória RAM. Geralmente, devem ser inicializados</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">antes do SO (Sistema Operacional), através do pen drive.</text></g><g transform="translate(130 230) rotate(0 178.9559326171875 22.5)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">O que usaremos são:</text></g><g transform="translate(129.9999999999999 310) rotate(0 779.9999999999998 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Memtest86 - é um teste de memória proprietário, da PassMark. Bom para ser usado em</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">computadores com firmware compatíveis com UEFI</text></g><g transform="translate(130 430) rotate(0 780 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Memtest86+ é um aplicativo open source que testa a memória RAM, com algumas</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">limitações: não suporta boot seguro.  #### Dúvida: ---&gt; Funciona com MBR e GPT?</text></g></svg>