      @font-face { font-family: Nunito; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1272" height="996" fill="#121212"></rect><g transform="translate(44.28332499999999 48) rotate(0 591.7166748046875 450)"><text x="0" y="34.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Conexão de rede ethernet</text><text x="0" y="79.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Crimpagem de Cabos</text><text x="0" y="124.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- IPs públicos e privados + estrutura numérica do IPv4 (decimal e binário)</text><text x="0" y="169.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Equipamentos de Rede</text><text x="0" y="214.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">        - Roteador</text><text x="0" y="259.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">        - Switch</text><text x="0" y="304.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">        - Cabos, etc</text><text x="0" y="349.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Compartilhamento de Pastas </text><text x="0" y="394.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">        &gt; Compartilhamento</text><text x="0" y="439.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">        &gt; ACL (Segurança/Permissão na Pasta)</text><text x="0" y="484.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Configurações de rede do S.O.</text><text x="0" y="529.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">      &gt; Firewall</text><text x="0" y="574.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">      &gt; Compartilhamento Avançado de Rede</text><text x="0" y="619.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">      &gt; Perfis de rede (Privado, Público, Domínio)</text><text x="0" y="664.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">      &gt; Configuração de IP(Manual ou automático)</text><text x="0" y="709.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Topologias de rede</text><text x="0" y="754.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- DHCP (Servidor e cliente)</text><text x="0" y="799.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Configurações de Rede em Hypervisores</text><text x="0" y="844.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Tipos de comunicação (Unicast, Multicast, Broadcast)</text><text x="0" y="889.344" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Teste de conectividade (ping)</text></g><g stroke-linecap="round" transform="translate(10 10) rotate(0 626 488)"><path d="M0 0 C490.72 0, 981.44 0, 1252 0 M0 0 C332.41 0, 664.81 0, 1252 0 M1252 0 C1252 227.04, 1252 454.08, 1252 976 M1252 0 C1252 375.32, 1252 750.65, 1252 976 M1252 976 C795.36 976, 338.71 976, 0 976 M1252 976 C865.41 976, 478.82 976, 0 976 M0 976 C0 699.89, 0 423.77, 0 0 M0 976 C0 756.5, 0 537, 0 0" stroke="#d3d3d3" stroke-width="4" fill="none"></path></g></svg>