40655274130242" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="54.15605478240376px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">controlada pelo cpu</text></g></svg>