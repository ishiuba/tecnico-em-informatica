<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1965.241576627784 665.0883083782514" width="5895.724729883352" height="1995.2649251347543"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1965.241576627784" height="665.0883083782514" fill="#121212"></rect><g transform="translate(10.00000047148842 10.000000121965058) rotate(0 374.11187744140625 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">O chipset fornece slots de expansão para </text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">o computador através da placa mãe</text></g><g transform="translate(10 100.00000023395091) rotate(0 421.19989013671875 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Ele tem compatibilidade com uma versão/geração</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">dos barramentos:</text></g><g transform="translate(10.000000028229806 190.00000019980143) rotate(0 325.6018981933594 135)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- sata</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- PCIexpress x1, x4 e x8 (x16 não!!!)</text><text x="0" y="121.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- usb (v4, 3.2, 3.1, 3, 2, etc...)</text><text x="0" y="166.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- placa de som onboard</text><text x="0" y="211.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- placa de rede ethernet onboard</text><text x="0" y="256.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- barramento m2</text></g><g transform="translate(1028.565795377784 10) rotate(0 463.337890625 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Já o CPU (processador) também é responsável pelos </text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">slots de expansão mais críticos do sistema:</text></g><g transform="translate(1028.5657957189665 189.99999997295845) rotate(0 349.45184326171875 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- PCIexpress x16 (para as GPUs)</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- barramento m2 nvme (ssd + m2 + pcie)</text></g><g transform="translate(10.000000332550371 467.54415442493087) rotate(0 740.9518432617188 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Qual a diferença? Geralmente o CPU tem versões mais recentes do barramento PCIe.</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Ex:</text></g><g transform="translate(10.000000731836735 565.0883083782514) rotate(0 321.76788330078125 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Processador dá suporte a PCIe v5</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#39994b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Chipset dá suporte a PCIe v4</text></g></svg>