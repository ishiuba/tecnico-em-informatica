<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 1160" width="5460" height="3480"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1820" height="1160" fill="#121212"></rect><g stroke-linecap="round" transform="translate(10 10) rotate(0 900 570)"><path d="M0 0 C373.55 0, 747.1 0, 1800 0 M0 0 C378.02 0, 756.04 0, 1800 0 M1800 0 C1800 328.75, 1800 657.5, 1800 1140 M1800 0 C1800 325.79, 1800 651.58, 1800 1140 M1800 1140 C1384.41 1140, 968.82 1140, 0 1140 M1800 1140 C1148.17 1140, 496.35 1140, 0 1140 M0 1140 C0 822.48, 0 504.96, 0 0 M0 1140 C0 850.65, 0 561.29, 0 0" stroke="#d3d3d3" stroke-width="4" fill="none"></path></g><g transform="translate(110 90) rotate(0 420.1160917883976 26.545281473904424)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Com bastante cuidado com as 'perninhas'</text></g><g transform="translate(110 170) rotate(0 215.95107461853968 26.545281473904424)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">## Para instalar ##</text></g><g transform="translate(110 250) rotate(0 670 26.545281473904424)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">1) Garantir que a trava (parte preta) está solta das 'perninhas'</text></g><g transform="translate(110 330) rotate(0 790 53.09056294780885)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2) Encaixar o cooler e as 'perninhas', apertando levemente a lateral do</text><text x="0" y="90.50879171342443" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">cooler para atravessar a placa mãe</text></g><g transform="translate(110 450) rotate(0 800 53.09056294780885)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3) Conferir a posição das travas (devem estar apontando para a tangente,</text><text x="0" y="90.50879171342443" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">não para o centro)</text></g><g transform="translate(110 570) rotate(0 790 53.09056294780885)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">4) Apertar as travas em diagonal, de duas em duas. Não tem ordem correta,</text><text x="0" y="90.50879171342443" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">desde que seja feito pelas diagonais</text></g><g transform="translate(110 690) rotate(0 200.10883997762824 26.545281473904424)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">## Para soltar ##</text></g><g transform="translate(110 750) rotate(0 790 53.09056294780885)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">1) Mudar a posição das travas, fazendo que as setas apontem para o</text><text x="0" y="90.50879171342443" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">centro do cooler</text></g><g transform="translate(110 870) rotate(0 800 53.09056294780885)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2) Destravar cada uma das 4 travas (garantir que a trava (parte preta)</text><text x="0" y="90.50879171342443" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">está solta das 'perninhas')</text></g><g transform="translate(110 990) rotate(0 338.65396310903157 26.545281473904424)"><text x="0" y="37.41822876561564" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="42.47245035824703px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3) Remover o cooler com cuidado</text></g></svg>