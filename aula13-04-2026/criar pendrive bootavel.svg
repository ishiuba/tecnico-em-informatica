<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 1220" width="5460" height="3660"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1820" height="1220" fill="#121212"></rect><g stroke-linecap="round" transform="translate(10 10) rotate(0 900 600)"><path d="M0 0 C373.55 0, 747.1 0, 1800 0 M0 0 C378.02 0, 756.04 0, 1800 0 M1800 0 C1800 346.05, 1800 692.11, 1800 1200 M1800 0 C1800 342.94, 1800 685.88, 1800 1200 M1800 1200 C1384.41 1200, 968.82 1200, 0 1200 M1800 1200 C1148.17 1200, 496.35 1200, 0 1200 M0 1200 C0 865.77, 0 531.53, 0 0 M0 1200 C0 895.42, 0 590.83, 0 0" stroke="#d3d3d3" stroke-width="4" fill="none"></path></g><g transform="translate(110 130) rotate(0 800 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Para criar um pen drive bootável, você precisa de um pen drive que possa ser formatado e</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">um aplicativo que torna o dispositivo inicializável (bootável).</text></g><g transform="translate(110 230) rotate(0 731.8977661132812 22.5)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Vários programas permitem que seu pen drive seja formatado e se torne inicializável:</text></g><g transform="translate(110 290) rotate(0 433.5478515625 22.5)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Ventoy (permite várias ISO no mesmo pen drive)</text></g><g transform="translate(110 350) rotate(0 438.80389404296875 22.5)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Rufus (copia os dados da ISO para o pen drive)</text></g><g transform="translate(110 410) rotate(0 551.8618774414062 22.5)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">- Balena Etcher (alta compatibilidade com vários tipos de ISO)</text></g><g transform="translate(110 470) rotate(0 800 112.5)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Percebeu que foi falado de arquivos no formato ISO? O arquivo ISO é uma 'imagem' de um</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">CD/DVD em formato digital, ou seja, ele simula o funcionamento da mídia física. Ao clicar</text><text x="0" y="121.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2x sobre o arquivo ISO, você 'monta' a imagem ISO no sistema operacional (Win 10 e 11),</text><text x="0" y="166.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">criando uma letra de unidade que simula um Drive de CD/DVD e onde será exibido todo o</text><text x="0" y="211.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">conteúdo do arquivo ISO.</text></g><g transform="translate(110 710) rotate(0 800 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">O formato ISO é tão importante que todos os fabricantes de sistemas operacionais (SO)</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">distribuem a instalação do seu SO no formato ISO também.</text></g><g transform="translate(110 830) rotate(0 800 45)"><text x="0" y="31.716" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Para baixar a ISO original de instalação do Windows 10 ou 11, basta digitar no Google:</text><text x="0" y="76.71600000000001" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="36px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">"download ISO Windows 10". Note que estamos usando somente software original.</text></g></svg>